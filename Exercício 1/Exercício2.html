<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 2</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    header {
      padding: 30px 16px 15px;
      background-color: #147db5;
      color: #ffffff;
      text-align: center;
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    nav button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #258fe5;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    nav button:hover {
      background-color: #117dcc;
    }

    main {
      padding: 32px 16px;
      text-align: center;
    }

    main h2 {
      margin: 16px 0 14px;
      font-size: 20px;
    }

    main p {
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu Site</h1>

    <nav aria-label="Menu principal">
      <button type="button">Início</button>
      <button type="button">Produtos</button>
      <button type="button">Sobre</button>
      <button type="button">Contato</button>
    </nav>
  </header>

  <main>
    <h2>Bem-vindo!</h2>
    <p>Escolha uma opção no menu acima.</p>
  </main>

</body>
</html>
